name: Home Security import integrity (read-only)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-security-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integrity:
    name: Offline source provenance and no-publish checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify import provenance, licensing and safe workflows
        run: python3 scripts/verify_import.py --json
      - name: Run guard regression tests
        run: python3 -m unittest discover -s tests/import_integrity -p 'test_*.py' -v
