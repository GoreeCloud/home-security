name: Home Security documentation build (read-only)

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/verify_import.py'
      - '.github/workflows/docs-validation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'

permissions:
  contents: read

concurrency:
  group: home-security-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Isolated docs build (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node without private registries
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install locked docs dependencies without lifecycle scripts
        working-directory: docs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile documentation preview (no deployment)
        working-directory: docs
        run: npm run build
