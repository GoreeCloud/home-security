version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
  - package-ecosystem: "pip"
    directory: "/docker/main"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
  - package-ecosystem: "pip"
    directory: "/docker/tensorrt"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@docusaurus/*"
    open-pull-requests-limit: 10
    target-branch: main
